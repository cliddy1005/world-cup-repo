<style>

<script>
/* ═══ DATA ═══ */
// Flags — comprehensive map for display only (covers 2022 + 2026 + common nations)
const FL={"Mexico":"🇲🇽","South Africa":"🇿🇦","South Korea":"🇰🇷","Korea Republic":"🇰🇷","Czechia":"🇨🇿","Czech Republic":"🇨🇿","Canada":"🇨🇦","Bosnia & Herzegovina":"🇧🇦","Bosnia and Herzegovina":"🇧🇦","Qatar":"🇶🇦","Switzerland":"🇨🇭","Brazil":"🇧🇷","Morocco":"🇲🇦","Haiti":"🇭🇹","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","United States":"🇺🇸","USA":"🇺🇸","Paraguay":"🇵🇾","Australia":"🇦🇺","Türkiye":"🇹🇷","Turkey":"🇹🇷","Germany":"🇩🇪","Curaçao":"🇨🇼","Curacao":"🇨🇼","Ivory Coast":"🇨🇮","Côte d'Ivoire":"🇨🇮","Ecuador":"🇪🇨","Netherlands":"🇳🇱","Japan":"🇯🇵","Sweden":"🇸🇪","Tunisia":"🇹🇳","Belgium":"🇧🇪","Egypt":"🇪🇬","Iran":"🇮🇷","New Zealand":"🇳🇿","Spain":"🇪🇸","Cape Verde":"🇨🇻","Cabo Verde":"🇨🇻","Saudi Arabia":"🇸🇦","Uruguay":"🇺🇾","France":"🇫🇷","Senegal":"🇸🇳","Iraq":"🇮🇶","Norway":"🇳🇴","Argentina":"🇦🇷","Algeria":"🇩🇿","Austria":"🇦🇹","Jordan":"🇯🇴","Portugal":"🇵🇹","DR Congo":"🇨🇩","Uzbekistan":"🇺🇿","Colombia":"🇨🇴","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croatia":"🇭🇷","Ghana":"🇬🇭","Panama":"🇵🇦","Wales":"🏴󠁧󠁢󠁷󠁬󠁳󠁿","Poland":"🇵🇱","Denmark":"🇩🇰","Costa Rica":"🇨🇷","Serbia":"🇷🇸","Cameroon":"🇨🇲","Nigeria":"🇳🇬","Italy":"🇮🇹","Peru":"🇵🇪","Chile":"🇨🇱","Russia":"🇷🇺","Iceland":"🇮🇸","China":"🇨🇳","India":"🇮🇳","Greece":"🇬🇷","Ireland":"🇮🇪","Romania":"🇷🇴","Hungary":"🇭🇺","Ukraine":"🇺🇦","Czech Republic":"🇨🇿"};
function flag(t){return flag(t)||"🏳️"}

// Dynamic data — derived from Firebase, not hardcoded
function getGroups(){
  // Build groups from fixture data
  const groups={};
  Object.values(S.fixtures).filter(f=>f.s==="Group"&&f.g).forEach(f=>{
    if(!groups[f.g])groups[f.g]=new Set();
    groups[f.g].add(f.h);groups[f.g].add(f.a);
  });
  const sorted={};Object.keys(groups).sort().forEach(g=>{sorted[g]=[...groups[g]].sort()});
  return sorted;
}
function getAllTeams(){const g=getGroups();return Object.values(g).flat()}
function getTeamGroup(t){const g=getGroups();for(const[grp,teams]of Object.entries(g)){if(teams.includes(t))return grp}return"?"}

const SC={win:3,draw:1,goal:1,cs:2};const MULT={Group:1,R32:1.5,R16:2,QF:2.5,SF:3,Final:4,"3rd":3};
const STAGES=["Group","R32","R16","QF","SF","3rd","Final"];
const PICK_COUNT=4;
const OUTRIGHT_BONUS=30;

// ── SCORES SOURCE ──
const SCORES_URL = "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json";
// TEST: swap to 2022 if you want completed results for testing
// const SCORES_URL = "https://raw.githubusercontent.com/openfootball/worldcup.json/master/2022/worldcup.json";

/* ═══ FIREBASE ═══ */
const FB_CFG={apiKey:"AIzaSyCjO4BbIGpTiY9Faff97a0Um3HL6dKoKHk",authDomain:"wc-pool-2026.firebaseapp.com",databaseURL:"https://wc-pool-2026-default-rtdb.europe-west1.firebasedatabase.app",projectId:"wc-pool-2026",storageBucket:"wc-pool-2026.firebasestorage.app",messagingSenderId:"459996582195",appId:"1:459996582195:web:48ade9f994d8e97d1fae46"};
let db,fbReady=false;
function initFB(){try{firebase.initializeApp(FB_CFG);db=firebase.database();fbReady=true;return true}catch(e){console.error(e);return false}}

/* ═══ STATE ═══ */
let S={user:null,isAdmin:false,pools:{},fixtures:{},knockout:{},admins:{},activePool:null};

async function loadState(){
  if(!fbReady)return;
  try{
    const [poolsSnap,fxSnap,koSnap,admSnap] = await Promise.all([
      db.ref("pools").once("value"),
      db.ref("fixtures").once("value"),
      db.ref("knockout").once("value"),
      db.ref("admins").once("value")
    ]);
    S.pools=poolsSnap.val()||{};
    S.fixtures=fxSnap.val()||{};
    S.knockout=koSnap.val()||{};
    S.admins=admSnap.val()||{};
  }catch(e){console.error("Firebase read error:",e)}
}
function savePool(pid){if(fbReady&&pid)db.ref("pools/"+pid).set(S.pools[pid])}
function saveFx(){if(fbReady)db.ref("fixtures").set(S.fixtures)}
function saveKO(){if(fbReady)db.ref("knockout").set(S.knockout)}

// Debounced render to prevent stack overflow from rapid Firebase updates
let _renderTimer=null;
function debouncedRender(){
  if(_renderTimer)clearTimeout(_renderTimer);
  _renderTimer=setTimeout(()=>{try{if(cv)render(cv)}catch(e){console.error("Render error:",e)}},100);
}

function listen(){
  if(!fbReady)return;
  db.ref("pools").on("value",snap=>{S.pools=snap.val()||{};debouncedRender()});
  db.ref("fixtures").on("value",snap=>{S.fixtures=snap.val()||{};debouncedRender()});
  db.ref("knockout").on("value",snap=>{S.knockout=snap.val()||{};debouncedRender()});
  db.ref("admins").on("value",snap=>{
    S.admins=snap.val()||{};
    if(S.user){
      const v=S.admins[S.user.uid];
      S.isAdmin=(v===true||v==="true"||v===1);
      console.log("Admin check:",S.user.uid,"→",S.isAdmin,v);
      if(S.isAdmin)$("admin-btn")?.classList.remove("hidden");
    }
    debouncedRender();
  });
}

/* ═══ SCORING ═══ */
function teamPts(team){
  let pts=0;[...Object.values(S.fixtures),...Object.values(S.knockout)].filter(f=>f.done&&(f.h===team||f.a===team)).forEach(f=>{
    const m=MULT[f.s]||1,sc=f.h===team?f.hs:f.as,co=f.h===team?f.as:f.hs;
    if(sc>co)pts+=SC.win*m;else if(sc===co)pts+=SC.draw*m;
    pts+=sc*SC.goal*m;if(co===0)pts+=SC.cs*m;
  });return Math.round(pts*10)/10;
}
function teamGD(team){
  let gf=0,ga=0;[...Object.values(S.fixtures),...Object.values(S.knockout)].filter(f=>f.done&&(f.h===team||f.a===team)).forEach(f=>{
    gf+=f.h===team?f.hs:f.as;ga+=f.h===team?f.as:f.hs;
  });return gf-ga;
}

function getLeaderboard(pid){
  const pool=S.pools[pid];if(!pool||!pool.participants)return[];
  const winner=pool.tournamentWinner||null; // set when final is played
  return Object.values(pool.participants).map(p=>{
    const picks=p.picks||[];
    const tp=picks.map(t=>({team:t,pts:teamPts(t),gd:teamGD(t)}));
    const total=tp.reduce((s,x)=>s+x.pts,0);
    const gd=tp.reduce((s,x)=>s+x.gd,0);
    const outright=p.outright||null;
    const outrightBonus=(winner&&outright===winner)?OUTRIGHT_BONUS:0;
    return{...p,picks,tp,total:total+outrightBonus,baseTotal:total,gd,outright,outrightBonus};
  }).sort((a,b)=>b.total-a.total||b.gd-a.gd); // tiebreak on GD
}

function getH2H(pid){
  const pool=S.pools[pid];if(!pool||!pool.participants)return[];
  const pMap={};Object.values(pool.participants).forEach(p=>{(p.picks||[]).forEach(t=>{if(!pMap[t])pMap[t]=[];pMap[t].push(p.id)})});
  const allFx=[...Object.values(S.fixtures),...Object.values(S.knockout)];
  return allFx.filter(f=>{
    const ho=pMap[f.h]||[],ao=pMap[f.a]||[];
    return ho.some(h=>ao.length&&!ao.includes(h));
  }).map(f=>{
    const ho=(pMap[f.h]||[]).map(id=>pool.participants[id]?.name).filter(Boolean);
    const ao=(pMap[f.a]||[]).map(id=>pool.participants[id]?.name).filter(Boolean);
    return{...f,homeOwners:ho,awayOwners:ao};
  });
}

/* ═══ NAV ═══ */
let cv=null;
const NAV=[{id:"dashboard",ic:"🏠",l:"Home"},{id:"leaderboard",ic:"🏆",l:"Table"},{id:"picks",ic:"⚽",l:"Picks"},{id:"h2h",ic:"⚔️",l:"H2H"},{id:"schedule",ic:"📅",l:"Games"}];
function buildNav(){$("bnav").innerHTML=NAV.map(n=>`<button onclick="goView('${n.id}')" id="n-${n.id}"><span class="ni">${n.ic}</span><span class="nl">${n.l}</span></button>`).join("")}
function goView(id){cv=id;render(id);document.querySelectorAll(".bnav button").forEach(b=>b.classList.toggle("act",b.id==="n-"+id));$("mc").scrollTop=0}
function render(id){
  const el=$("mc");if(!el)return;
  try{
    switch(id){
      case"dashboard":el.innerHTML=rDash();break;case"leaderboard":el.innerHTML=rLB();break;
      case"picks":el.innerHTML=rPicks();break;case"h2h":el.innerHTML=rH2H();break;
      case"schedule":el.innerHTML=rSched();break;case"admin":el.innerHTML=rAdmin();break;
      case"pool-select":el.innerHTML=rPoolSelect();break;
    }
  }catch(e){console.error("Render error ["+id+"]:",e);el.innerHTML=`<div class="cd"><p class="ts tr2">Error rendering view: ${e.message}</p><button class="btn-s btn-o mt8" onclick="location.reload()">Reload</button></div>`}
}
function $(id){return document.getElementById(id)}

/* ═══ POOL SELECTION ═══ */
function myPools(){
  if(!S.user)return[];
  return Object.entries(S.pools).filter(([pid,p])=>p.participants&&p.participants[S.user.uid]).map(([pid,p])=>({pid,...p}));
}

function rPoolSelect(){
  const pools=myPools();
  let h=`<div class="st">YOUR POOLS</div>`;
  if(pools.length){
    pools.forEach(p=>{
      const count=Object.keys(p.participants||{}).length;
      h+=`<div class="cd" style="cursor:pointer" onclick="selectPool('${p.pid}')">
        <div class="fb"><span class="ts fw6">${p.name}</span><span class="pill">${count} players</span></div>
        <div class="tx tm mt8">Code: ${p.code}</div>
      </div>`;
    });
  }
  h+=`<div class="cd"><div class="lb">Join a Pool</div>
    <input id="join-code" class="inp" placeholder="Enter invite code" style="text-transform:uppercase;letter-spacing:2px;text-align:center">
    <button class="btn mt12" onclick="joinPool()">JOIN</button>
    <div id="join-err" class="err hidden mt8"></div>
  </div>`;
  // Show upcoming matches
  h+=renderUpcoming();
  return h;
}

function selectPool(pid){S.activePool=pid;localStorage.setItem("wc-active",pid);buildNav();goView("dashboard")}

function joinPool(){
  const code=$("join-code").value.trim().toUpperCase();
  const errEl=$("join-err");
  if(!code){errEl.textContent="Enter an invite code";errEl.classList.remove("hidden");return}
  const found=Object.entries(S.pools).find(([_,p])=>p.code.toUpperCase()===code);
  if(!found){errEl.textContent="No pool found with that code";errEl.classList.remove("hidden");return}
  const [pid,pool]=found;
  if(!pool.regOpen){errEl.textContent="Registration closed for this pool";errEl.classList.remove("hidden");return}
  if(pool.participants&&pool.participants[S.user.uid]){selectPool(pid);return}
  // Add participant
  if(!S.pools[pid].participants)S.pools[pid].participants={};
  // Assign random outright winner from unassigned
  const taken=new Set(Object.values(S.pools[pid].participants).map(p=>p.outright).filter(Boolean));
  const avail=getAllTeams().filter(t=>!taken.has(t));
  const outright=avail.length?avail[Math.floor(Math.random()*avail.length)]:getAllTeams()[Math.floor(Math.random()*getAllTeams().length)];
  S.pools[pid].participants[S.user.uid]={id:S.user.uid,name:S.user.displayName||S.user.email.split("@")[0],email:S.user.email,picks:[],outright,joinedAt:new Date().toISOString()};
  savePool(pid);selectPool(pid);
}

/* ═══ PICKS ═══ */
function rPicks(){
  const pid=S.activePool;const pool=S.pools[pid];if(!pool)return"";
  const me=pool.participants?.[S.user.uid];if(!me)return"";
  const picks=me.picks||[];
  const locked=picks.length>=PICK_COUNT;

  let h=`<div class="st">PICK YOUR ${PICK_COUNT} TEAMS</div>`;
  if(me.outright){
    h+=`<div class="cd cd-g" style="padding:14px"><div class="fb">
      <div><div class="tx tm">🎲 Outright Winner (randomly assigned)</div><div class="ts fw6 mt8">${flag(me.outright)} ${me.outright}</div></div>
      <div class="pill">${teamPts(me.outright)} pts</div>
    </div><div class="tx tm mt8">+${OUTRIGHT_BONUS} bonus pts if they win the tournament</div></div>`;
  }

  // Current picks
  h+=`<div class="cd"><div class="lb">Your Picks (${picks.length}/${PICK_COUNT})</div>`;
  if(!picks.length) h+=`<p class="ts tm">Select ${PICK_COUNT} teams below to compete in this pool.</p>`;
  else {
    picks.forEach(t=>{
      h+=`<div class="fb" style="padding:8px 0;border-bottom:1px solid var(--brd)">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">${flag(t)}</span><div><div class="ts fw6">${t}</div><div class="tx tm">Grp ${getTeamGroup(t)} · ${teamPts(t)} pts · GD ${teamGD(t)>=0?"+":""}${teamGD(t)}</div></div></div>
        ${!pool.pickingLocked?`<button class="btn-s btn-d" onclick="removePick('${t}')">✕</button>`:""}
      </div>`;
    });
  }
  h+=`</div>`;

  // Team selector
  if(!pool.pickingLocked&&picks.length<PICK_COUNT){
    h+=`<div class="cd"><div class="lb">Select Teams</div>`;
    Object.entries(getGroups()).forEach(([grp,teams])=>{
      h+=`<div class="tx tg2 fw6 mb8 ${grp!=='A'?'mt12':''}">Group ${grp}</div>`;
      teams.forEach(t=>{
        const picked=picks.includes(t);
        h+=`<button class="pick-btn ${picked?'sel':''}" onclick="${picked?`removePick('${t}')`:`addPick('${t}')`}" ${picked?"":""}">
          <span class="fl">${flag(t)}</span><div class="pi"><div class="pn">${t}</div><div class="pm">${teamPts(t)} pts · GD ${teamGD(t)>=0?"+":""}${teamGD(t)}</div></div>
          ${picked?'<span class="pill">Picked</span>':""}
        </button>`;
      });
    });
    h+=`</div>`;
  } else if(pool.pickingLocked){
    h+=`<div class="cd tc"><p class="ts tm">Picks are locked 🔒</p></div>`;
  }
  return h;
}

function addPick(team){
  const pid=S.activePool;const me=S.pools[pid].participants[S.user.uid];
  if(!me||(me.picks||[]).length>=PICK_COUNT)return;
  if(!me.picks)me.picks=[];
  if(me.picks.includes(team))return;
  me.picks.push(team);savePool(pid);render(cv);
}
function removePick(team){
  const pid=S.activePool;const me=S.pools[pid].participants[S.user.uid];
  if(!me||S.pools[pid].pickingLocked)return;
  me.picks=(me.picks||[]).filter(t=>t!==team);savePool(pid);render(cv);
}

/* ═══ H2H ═══ */
function rH2H(){
  const pid=S.activePool;if(!pid)return"";
  const matches=getH2H(pid);const up=matches.filter(m=>!m.done);const dn=matches.filter(m=>m.done);
  let h=`<div class="st">HEAD-TO-HEAD</div><p class="ts tm mb12">When pool members' teams face each other.</p>`;
  if(!matches.length)return h+`<div class="cd"><p class="ts tm">No H2H matches yet — pick your teams first.</p></div>`;
  if(up.length){h+=`<div class="lb">Upcoming</div>`;up.forEach(m=>{h+=matchCard(m,true)});}
  if(dn.length){h+=`<div class="lb mt16">Completed</div>`;dn.forEach(m=>{h+=matchCard(m,false)});}
  return h;
}

  return`<div class="cd ${upcoming?'cd-h':''}" style="padding:12px">

/* ═══ SCORE SYNC — builds fixtures from data source ═══ */
function parseStage(round){
  if(!round)return{s:"Group",md:1};
  const r=round.toLowerCase();
  if(r.includes("round of 16"))return{s:"R16",md:50};
  if(r.includes("round of 32"))return{s:"R32",md:40};
  if(r.includes("quarter"))return{s:"QF",md:60};
  if(r.includes("semi"))return{s:"SF",md:70};
  if(r.includes("third")||r.includes("3rd"))return{s:"3rd",md:80};
  if(r.includes("final")&&!r.includes("semi")&&!r.includes("quarter"))return{s:"Final",md:90};
  // Group matchday
  const mdMatch=r.match(/matchday\s*(\d+)/i)||r.match(/(\d+)/);
  return{s:"Group",md:mdMatch?parseInt(mdMatch[1]):1};
}

async function syncScores(){
  try{
    const r=await fetch(SCORES_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("Fetch failed: "+r.status);
    const d=await r.json();
    const built=buildFixtures(d);
    S.fixtures=built.group;S.knockout=built.ko;
    saveFx();saveKO();
    const total=Object.keys(built.group).length+Object.keys(built.ko).length;
    const scored=Object.values(built.group).filter(f=>f.done).length+Object.values(built.ko).filter(f=>f.done).length;
    alert(`${total} fixtures loaded · ${scored} with results ✅`);
  }catch(e){alert("Sync error: "+e.message)}
  if(cv)render(cv);
}

async function syncScoresAuto(){
  try{
    const r=await fetch(SCORES_URL,{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    const built=buildFixtures(d);
    S.fixtures=built.group;S.knockout=built.ko;
    saveFx();saveKO();
  }catch(e){console.log("Auto-sync:",e.message)}
  if(cv)render(cv);
}

function buildFixtures(data){
  const matches=data.matches||[];
  const group={};const ko={};
  matches.forEach((m,i)=>{
    const id=i+1;
    const home=m.team1||"TBD";
    const away=m.team2||"TBD";
    const grp=m.group?m.group.replace("Group ",""):"";
    const{s,md}=parseStage(m.round);
    const hasScore=m.score&&m.score.ft;
    const fx={id,h:home,a:away,g:grp,s,md,dt:m.date||"",hs:hasScore?m.score.ft[0]:null,as:hasScore?m.score.ft[1]:null,done:!!hasScore};
    if(s==="Group")group[id]=fx;else ko[id]=fx;
  });
  return{group,ko};
}

      h+=`<div class="fb" style="padding:4px 0;font-size:12px;border-bottom:1px solid var(--brd)">
        <span style="flex:1;display:flex;align-items:center;gap:4px">${flag(f.h)}<span class="trunc">${f.h.substring(0,12)}</span></span>`;
      if(f.done) h+=`<span class="fw6">${f.hs}-${f.as}</span><button class="btn-s btn-d" style="font-size:10px;padding:2px 6px;margin-left:4px" onclick="clearFx(${f.id})">✕</button>`;
      else h+=`<button class="btn-s btn-o" style="font-size:10px;padding:2px 6px" onclick="enterScore(${f.id})">Enter</button>`;
      h+=`<span style="flex:1;display:flex;align-items:center;gap:4px;justify-content:flex-end"><span class="trunc">${f.a.substring(0,12)}</span>${flag(f.a)}</span></div>`;
    });
  });
  h+=`</div>`;

  // Tournament winner (for outright bonus)
  h+=`<div class="cd"><div class="lb">🏆 Tournament Winner</div>
    <p class="tx tm mb8">Set the winner to award ${OUTRIGHT_BONUS}pt outright bonus across all pools.</p>
    <select class="inp" id="tw-sel" onchange="setWinner(this.value)">
      <option value="">Not decided yet</option>
      ${getAllTeams().map(t=>`<option value="${t}">${flag(t)} ${t}</option>`).join("")}
    </select></div>`;

  // Admin management
  const allUsers=new Set();
  Object.values(S.pools).forEach(p=>{Object.values(p.participants||{}).forEach(u=>{allUsers.add(JSON.stringify({uid:u.id,name:u.name,email:u.email}))})});
  const users=[...allUsers].map(u=>JSON.parse(u));
  h+=`<div class="cd"><div class="lb">🔑 Admin Management</div>
    <p class="tx tm mb8">Admins can manage all pools, scores, and settings.</p>`;
  const adminUids=Object.keys(S.admins).filter(k=>S.admins[k]);
  if(adminUids.length){
    h+=`<div class="mb12">`;
    adminUids.forEach(uid=>{
      const user=users.find(u=>u.uid===uid);
      h+=`<div class="fb" style="padding:5px 0;border-bottom:1px solid var(--brd)">
        <div><div class="tx fw6">${user?.name||uid.substring(0,12)}</div><div class="tx tm">${user?.email||""}</div></div>
        ${uid!==S.user.uid?`<button class="btn-s btn-d" style="font-size:10px;padding:2px 6px" onclick="removeAdmin('${uid}')">Remove</button>`:`<span class="pill">You</span>`}
      </div>`;
    });
    h+=`</div>`;
  }
  if(users.filter(u=>!S.admins[u.uid]).length){
    h+=`<select class="inp" id="add-admin-sel"><option value="">Promote a user to admin…</option>`;
    users.filter(u=>!S.admins[u.uid]).forEach(u=>{h+=`<option value="${u.uid}">${u.name} (${u.email||"no email"})</option>`});
    h+=`</select><button class="btn-s btn-g mt8" onclick="const v=$('add-admin-sel').value;if(v){addAdmin(v);render('admin')}">Make Admin</button>`;
  }
  h+=`</div>`;

  return h;
}

function createPool(){
  const name=$("np-name").value.trim();const code=$("np-code").value.trim().toUpperCase();
  if(!name||!code){alert("Enter a name and invite code");return}
  if(Object.values(S.pools).some(p=>p.code.toUpperCase()===code)){alert("That code is already in use");return}
  const pid="pool_"+Date.now();
  S.pools[pid]={name,code,regOpen:true,pickingLocked:false,participants:{},createdBy:S.user.uid};
  savePool(pid);render("admin");
}
function togglePoolReg(pid){S.pools[pid].regOpen=!S.pools[pid].regOpen;savePool(pid);render("admin")}
function togglePicks(pid){S.pools[pid].pickingLocked=!S.pools[pid].pickingLocked;savePool(pid);render("admin")}
function deletePool(pid){if(!confirm("Delete this pool?"))return;S.pools[pid]=null;if(fbReady)db.ref("pools/"+pid).remove();delete S.pools[pid];render("admin")}
function enterScore(id){const h=prompt("Home goals:");const a=prompt("Away goals:");if(h===null||a===null)return;S.fixtures[id].hs=parseInt(h);S.fixtures[id].as=parseInt(a);S.fixtures[id].done=true;saveFx();render("admin")}
function clearFx(id){S.fixtures[id].hs=null;S.fixtures[id].as=null;S.fixtures[id].done=false;saveFx();render("admin")}
function setWinner(team){Object.keys(S.pools).forEach(pid=>{S.pools[pid].tournamentWinner=team||null;savePool(pid)});render("admin")}

/* ═══ AUTH ═══ */
let authMode="signup";
function setMode(m){
  authMode=m;
  $("name-row").style.display=m==="signup"?"block":"none";
  $("tab-su").style.background=m==="signup"?"rgba(201,168,76,0.15)":"rgba(255,255,255,0.03)";
  $("tab-su").style.color=m==="signup"?"#C9A84C":"#8B95A5";
  $("tab-si").style.background=m==="signin"?"rgba(201,168,76,0.15)":"rgba(255,255,255,0.03)";
  $("tab-si").style.color=m==="signin"?"#C9A84C":"#8B95A5";
  $("forgot-row").classList.toggle("hidden",m==="signup");
  $("login-err").classList.add("hidden");
  document.querySelector("#v-login .btn").textContent=m==="signup"?"CREATE ACCOUNT":"SIGN IN";
}

async function googleSignIn(){
  const err=$("login-err");err.classList.add("hidden");
  try{
    const prov=new firebase.auth.GoogleAuthProvider();
    const cred=await firebase.auth().signInWithPopup(prov);
    S.user=cred.user;S.isAdmin=!!S.admins[cred.user.uid];enterApp();
  }catch(e){if(e.code!=="auth/popup-closed-by-user"){err.textContent=e.message;err.classList.remove("hidden")}}
}

async function emailSignIn(){
  const err=$("login-err");err.classList.add("hidden");
  const email=$("l-email").value.trim();
  const pass=$("l-pass").value;
  if(!email){err.textContent="Enter your email";err.classList.remove("hidden");return}
  if(!pass||pass.length<6){err.textContent="Password must be at least 6 characters";err.classList.remove("hidden");return}
  const auth=firebase.auth();
  try{
    let cred;
    if(authMode==="signup"){
      const name=$("l-name").value.trim();
      if(!name){err.textContent="Enter a display name";err.classList.remove("hidden");return}
      cred=await auth.createUserWithEmailAndPassword(email,pass);
      await cred.user.updateProfile({displayName:name});
    } else {
      cred=await auth.signInWithEmailAndPassword(email,pass);
    }
    S.user=cred.user;S.isAdmin=!!S.admins[cred.user.uid];enterApp();
  }catch(e){
    const msg=e.code==="auth/email-already-in-use"?"Email already registered — try Sign In"
      :e.code==="auth/user-not-found"?"No account found — try Sign Up"
      :e.code==="auth/wrong-password"||e.code==="auth/invalid-credential"?"Wrong email or password"
      :e.code==="auth/too-many-requests"?"Too many attempts — try later"
      :e.message;
    err.textContent=msg;err.classList.remove("hidden");
  }
}

async function resetPw(){
  const email=$("l-email").value.trim();
  if(!email){alert("Enter your email first");return}
  try{await firebase.auth().sendPasswordResetEmail(email);alert("Reset email sent — check your inbox")}catch(e){alert(e.message)}
}

function addAdmin(uid){if(!S.isAdmin)return;S.admins[uid]=true;db.ref("admins/"+uid).set(true)}
function removeAdmin(uid){if(!S.isAdmin||uid===S.user.uid)return;delete S.admins[uid];db.ref("admins/"+uid).remove()}

function checkAdmin(){
  if(!S.user)return false;
  const v=S.admins[S.user.uid];
  return(v===true||v==="true"||v===1);
}

function enterApp(){
  $("loader").classList.add("hidden");$("app").classList.remove("hidden");$("v-login").classList.add("hidden");$("v-main").classList.remove("hidden");
  $("hdr-user").textContent=S.user.displayName||S.user.email;
  S.isAdmin=checkAdmin();
  console.log("User:",S.user.uid,"Admin:",S.isAdmin,"Admins:",JSON.stringify(S.admins));
  if(S.isAdmin)$("admin-btn").classList.remove("hidden");else $("admin-btn").classList.add("hidden");
  buildNav();
  // Auto-sync scores in background (non-blocking)
  syncScoresAuto();
  const saved=localStorage.getItem("wc-active");
  if(saved&&S.pools[saved]&&S.pools[saved].participants?.[S.user.uid]){S.activePool=saved;goView("dashboard")}
  else{goView("pool-select")}
}

function logout(){firebase.auth().signOut();S.user=null;S.isAdmin=false;S.activePool=null;
  $("loader").classList.add("hidden");$("app").classList.remove("hidden");$("v-login").classList.remove("hidden");$("v-main").classList.add("hidden");$("admin-btn").classList.add("hidden")}

/* ═══ BOOT ═══ */
document.addEventListener("DOMContentLoaded",async()=>{
  initFB();

  // Load state with error handling — never block the login screen
  try{ await loadState() }catch(e){ console.error("Load failed:",e) }
  try{ listen() }catch(e){ console.error("Listen failed:",e) }

  // Failsafe: always show login after 3 seconds no matter what
  setTimeout(()=>{
    if(!S.user){
      $("loader").classList.add("hidden");$("app").classList.remove("hidden");
      $("v-login").classList.remove("hidden");$("v-main").classList.add("hidden");
    }
  }, 3000);

  // Auth state listener
  try{
    firebase.auth().onAuthStateChanged(user=>{
      if(user){S.user=user;S.isAdmin=checkAdmin();enterApp()}
      else{$("loader").classList.add("hidden");$("app").classList.remove("hidden");$("v-login").classList.remove("hidden");$("v-main").classList.add("hidden")}
    });
  }catch(e){
    console.error("Auth error:",e);
    $("loader").classList.add("hidden");$("app").classList.remove("hidden");
    $("v-login").classList.remove("hidden");$("v-main").classList.add("hidden");
  }
});
</script>
